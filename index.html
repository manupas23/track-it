<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track.It</title>
<meta name="description" content="Video analysis for physics: calibrate, track objects frame by frame and get positions, velocities and accelerations.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M3 28Q14-4 29 24' fill='none' stroke='%233987e5' stroke-width='2.4' stroke-linecap='round' stroke-dasharray='0.1 3.6'/><circle cx='6.4' cy='19.8' r='2.6' fill='%233987e5'/><circle cx='12.4' cy='12' r='2.6' fill='%233987e5'/><circle cx='19' cy='11.8' r='2.6' fill='%233987e5'/><circle cx='25.5' cy='18.1' r='4.8' fill='none' stroke='%23e8763f' stroke-width='2.6'/><circle cx='25.5' cy='18.1' r='1.6' fill='%23e8763f'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 28Q14-4 29 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 3.6" opacity=".75"/><circle cx="6.4" cy="19.8" r="2.3" fill="currentColor"/><circle cx="12.4" cy="12" r="2.3" fill="currentColor"/><circle cx="19" cy="11.8" r="2.3" fill="currentColor"/><circle cx="25.5" cy="18.1" r="4.6" fill="none" stroke="#e8763f" stroke-width="2.2"/><circle cx="25.5" cy="18.1" r="1.5" fill="#e8763f"/></svg>Track.It</div>
  <div class="actions">
    <label class="btn primary"><span data-i18n="open_video">Open video</span><input id="fileVideo" type="file" accept="video/*" hidden></label>
    <label class="btn"><span data-i18n="open_project">Open project</span><input id="fileProject" type="file" accept=".json,application/json" hidden></label>
    <button class="btn" id="btnSaveProject" data-i18n="save_project" disabled>Save project</button>
    <button class="btn" id="btnCsv" data-i18n="export_csv" disabled>Export CSV</button>
    <button class="btn icon" id="btnUndo" data-i18n-title="undo_t" disabled>↶</button>
    <button class="btn icon" id="btnRedo" data-i18n-title="redo_t" disabled>↷</button>
    <button class="btn icon" id="btnHelp" data-i18n-title="help_t">?</button>
    <div class="seg lang" role="group" data-i18n-aria="lang_t" data-i18n-title="lang_t">
      <button class="seg-btn lang-btn" data-lang="es">ES</button>
      <button class="seg-btn lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="layout">
  <section class="viewer">
    <div class="toolbar">
      <div class="seg" role="group" data-i18n-aria="tool_group">
        <button class="seg-btn active" data-tool="move" data-i18n="tool_move" data-i18n-title="tool_move_t">Move</button>
        <button class="seg-btn" data-tool="mark" data-i18n="tool_mark" data-i18n-title="tool_mark_t">Mark</button>
        <button class="seg-btn" data-tool="auto" data-i18n="tool_auto" data-i18n-title="tool_auto_t">Auto</button>
      </div>
      <label class="chk"><input type="checkbox" id="showCalib" checked> <span data-i18n="show_calib">Stick</span></label>
      <label class="chk"><input type="checkbox" id="showAxes" checked> <span data-i18n="show_axes">Axes</span></label>
      <label class="chk"><input type="checkbox" id="showTrails" checked> <span data-i18n="show_trails">Trails</span></label>
      <label class="chk" data-i18n-title="show_search_t"><input type="checkbox" id="showSearch" checked> <span data-i18n="show_search">Search</span></label>
      <span class="spacer"></span>
      <span class="readout" id="cursorReadout"></span>
      <button class="btn small" id="btnFit" data-i18n="fit" data-i18n-title="fit_t">Fit</button>
    </div>

    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div class="drop" id="dropHint">
        <div>
          <p class="big" data-i18n="drop_big">Drop a video here</p>
          <p data-i18n-html="drop_html">or click <b>Open video</b>. MP4 (H.264) or WebM work best.</p>
          <p class="muted" data-i18n="drop_private">Your video never leaves your computer: it is analysed in the browser.</p>
        </div>
      </div>
      <div class="busy" id="busy" hidden></div>
    </div>

    <div class="transport">
      <button class="btn icon" id="btnStart" data-i18n-title="t_start">⏮</button>
      <button class="btn icon" id="btnPrev" data-i18n-title="t_prev">◀</button>
      <button class="btn icon" id="btnPlay" data-i18n-title="t_play">▶</button>
      <button class="btn icon" id="btnNext" data-i18n-title="t_next">▶▏</button>
      <button class="btn icon" id="btnEnd" data-i18n-title="t_end">⏭</button>
      <div class="scrub" id="scrub">
        <input type="range" id="slider" min="0" max="0" value="0" step="1">
        <div class="trim">
          <input type="range" id="trimStart" min="0" max="0" value="0" step="1" data-i18n-title="trim_start_t" data-i18n-aria="trim_start_t">
          <input type="range" id="trimEnd" min="0" max="0" value="0" step="1" data-i18n-title="trim_end_t" data-i18n-aria="trim_end_t">
        </div>
      </div>
      <span class="readout" id="frameReadout">–</span>
    </div>
    <video id="video" playsinline muted preload="auto"></video>
  </section>

  <aside class="side">
    <details class="panel" data-p="video" open>
      <summary data-i18n="p_video">Video and time</summary>
      <div class="grid2">
        <label><span data-i18n="fps_file">File fps</span><input type="number" id="fps" min="1" max="1000" step="0.001"></label>
        <label data-i18n-title="fps_real_t"><span data-i18n="fps_real">Real fps</span><input type="number" id="fpsReal" min="0.001" step="0.001"></label>
        <label data-i18n-title="t0_t"><span data-i18n="t0">t = 0 at frame</span><input type="number" id="t0" min="0" step="1" value="0"></label>
        <label><span data-i18n="range_step">Step</span><input type="number" id="rangeStep" min="1" step="1" value="1"></label>
        <label><span data-i18n="dt_step">Δt per step</span><output id="dtOut">–</output></label>
      </div>
      <p class="hint" data-i18n-html="hint_time_html"></p>
    </details>

    <details class="panel" data-p="calib" open>
      <summary data-i18n="p_calib">Calibration and axes</summary>
      <div class="grid2">
        <label><span data-i18n="calib_len">Stick length</span><input type="number" id="calibLen" min="0" step="any" value="1"></label>
        <label><span data-i18n="calib_unit">Unit</span><input type="text" id="calibUnit" value="m" maxlength="6"></label>
        <label><span data-i18n="axes_angle">Axes angle (°)</span><input type="number" id="axesAngle" step="0.1" value="0"></label>
        <label><span data-i18n="scale">Scale</span><output id="scaleOut">–</output></label>
      </div>
      <label class="chk"><input type="checkbox" id="calibOn" checked> <span data-i18n="calib_on">Use calibration</span></label>
      <p class="hint" data-i18n="hint_calib"></p>
    </details>

    <details class="panel" data-p="objs" open>
      <summary data-i18n="p_objs">Objects</summary>
      <div id="trackList" class="tracklist"></div>
      <button class="btn small" id="btnAddTrack" data-i18n="add_track">+ New object</button>
      <div class="sub">
        <div class="subhead" data-i18n="range_head">Range of the selected object</div>
        <div class="grid2">
          <label><span data-i18n="range_start">First frame</span><input type="number" id="rangeStart" min="0" step="1"></label>
          <label><span data-i18n="range_end">Last frame</span><input type="number" id="rangeEnd" min="0" step="1"></label>
        </div>
        <p class="hint" data-i18n-html="hint_range_html"></p>
      </div>
      <div class="sub">
        <div class="subhead" data-i18n="auto_head">Autotracking</div>
        <div class="grid2">
          <label data-i18n-title="tpl_size_t"><span data-i18n="tpl_size">Template (px)</span><input type="number" id="tplSize" min="5" max="801" step="2" value="21"></label>
          <label data-i18n-title="search_r_t"><span data-i18n="search_r">Search radius</span><input type="number" id="searchR" min="3" max="1500" step="1" value="30"></label>
          <label data-i18n-title="threshold_t"><span data-i18n="threshold">Threshold</span><input type="number" id="matchMin" min="0" max="1" step="0.05" value="0.7"></label>
          <label class="chk inline" data-i18n-title="evolve_t"><input type="checkbox" id="tplEvolve"> <span data-i18n="evolve">Evolving template</span></label>
        </div>
        <div class="tplrow">
          <canvas id="tplPreview" width="72" height="72" data-i18n-title="tpl_preview_t"></canvas>
          <p class="hint" data-i18n="hint_tpl"></p>
        </div>
        <button class="btn primary small" id="btnAuto" disabled>Autotrack from here</button>
        <p class="hint" data-i18n-html="hint_auto_html"></p>
      </div>
    </details>

    <details class="panel" data-p="plot" open>
      <summary data-i18n="p_plot">Plot</summary>
      <div class="plotctl">
        <select id="plotY" data-i18n-aria="plot_y_aria"></select>
        <span class="muted" data-i18n="plot_vs">vs</span>
        <select id="plotX" data-i18n-aria="plot_x_aria"></select>
        <select id="fitType" data-i18n-aria="fit_aria">
          <option value="0" data-i18n="fit0">No fit</option>
          <option value="1" data-i18n="fit1">Linear</option>
          <option value="2" data-i18n="fit2">Quadratic</option>
          <option value="3" data-i18n="fit3">Cubic</option>
        </select>
      </div>
      <div class="plotwrap" id="plotWrap">
        <canvas id="plot"></canvas>
        <div class="tip" id="plotTip" hidden></div>
      </div>
      <div class="fitout" id="fitOut"></div>
    </details>

    <details class="panel" data-p="table" open>
      <summary data-i18n="p_table">Table</summary>
      <div class="tablewrap"><table id="dataTable"></table></div>
    </details>
  </aside>
</main>

<dialog id="help">
  <h2 data-i18n="help_title">How to use it</h2>
  <div data-i18n-html="help_html"></div>
  <form method="dialog"><button class="btn primary" data-i18n="help_ok">Got it</button></form>
</dialog>

<dialog id="ask" class="ask" aria-labelledby="askTitle">
  <h2 id="askTitle"></h2>
  <p id="askText"></p>
  <p id="askDetail" class="muted"></p>
  <div class="ask-actions" id="askActions"></div>
</dialog>

<div class="toast" id="toast" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
